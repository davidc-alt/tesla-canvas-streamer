<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Streamer - YouTube Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Navbar / Search Bar -->
    <header class="navbar">
      <div class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">Canvas Streamer</span>
      </div>

      <div class="search-form">
        <input type="text" id="url-input" placeholder="Search YouTube video name or paste URL..." />
        <button id="search-btn" class="search-btn" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </header>

    <div id="status-bar" class="status-bar">Status: Ready. Type a title or paste a YouTube link.</div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search Results Grid -->
      <section id="results-container" class="results-container">
        <h2 class="section-title">Recommended & Search Results</h2>
        <div id="results-grid" class="results-grid"></div>
      </section>

      <!-- YouTube-Style Video Player Overlay -->
      <section id="player-section" class="player-section hidden">
        <div id="player-viewport-wrapper" class="player-viewport-wrapper">
          <div class="player-header">
            <div class="video-meta">
              <h2 id="video-title-display" class="player-video-title">Video Title</h2>
              <span id="video-channel-display" class="player-video-channel">Channel Name</span>
            </div>
            <button id="close-player-btn" class="icon-btn close-btn" title="Back to Search">✕</button>
          </div>

          <div id="media-container" class="media-container">
            <video id="video-player" playsinline crossorigin="anonymous"></video>
            <div id="loading-overlay" class="loading-overlay hidden">
              <div class="spinner"></div>
              <span id="loading-text">Buffering Stream...</span>
            </div>
          </div>

          <!-- Integrated Controls Bar -->
          <div class="player-controls-bar">
            <div class="controls-left">
              <button id="play-pause-btn" class="control-btn" title="Play/Pause">⏸</button>
              <button id="volume-btn" class="control-btn" title="Mute/Unmute">🔊</button>
              <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" class="volume-slider" />
              <span id="time-display" class="time-display">0:00 / 0:00</span>
            </div>

            <div class="timeline-wrapper">
              <input type="range" id="timeline-slider" min="0" max="100" value="0" step="0.1" class="timeline-slider" />
            </div>

            <div class="controls-right">
              <label for="player-profile-select" class="profile-label">Quality:</label>
              <select id="player-profile-select" class="player-profile-select">
                <option value="360p" selected>360p (Ultra Light)</option>
                <option value="480p">480p (Standard)</option>
                <option value="720p">720p (High HD)</option>
              </select>

              <button id="fullscreen-btn" class="control-btn" title="Fullscreen">⛶</button>
              <button id="stop-btn" class="danger-btn">Stop</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
