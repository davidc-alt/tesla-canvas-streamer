<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="yt-header">
    <div class="header-left">
      <button id="menu-toggle-btn" class="menu-btn" title="Toggle Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div id="home-logo" class="yt-logo" title="David Home">
        <svg width="30" height="22" viewBox="0 0 30 22" fill="none"><path d="M29.35 3.3A3.75 3.75 0 0026.7.65C24.36 0 15 0 15 0S5.64 0 3.3.65A3.75 3.75 0 00.65 3.3C0 5.64 0 11 0 11s0 5.36.65 7.7a3.75 3.75 0 002.65 2.65C5.64 22 15 22 15 22s9.36 0 11.7-.65a3.75 3.75 0 002.65-2.65c.65-2.34.65-7.7.65-7.7s0-5.36-.65-7.7z" fill="#FF0000"/><path d="M12 15.75L19.5 11 12 6.25v9.5z" fill="#FFFFFF"/></svg>
        <span class="logo-text">David</span>
      </div>
    </div>

    <div class="header-center">
      <div class="search-form">
        <input type="text" id="url-input" placeholder="Search videos or paste YouTube link..." />
        <button id="search-btn" class="search-btn" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
    </div>

    <div class="header-right">
      <!-- Light / Dark Mode Toggle Button -->
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light/Dark Mode">
        <span id="theme-icon">☀️ Light</span>
      </button>
      <div class="user-avatar" title="User Profile">D</div>
    </div>
  </header>

  <!-- YouTube App Layout -->
  <div class="yt-container">
    <!-- Left Navigation Drawer -->
    <aside id="yt-sidebar" class="yt-sidebar">
      <nav class="sidebar-nav">
        <button id="nav-home-btn" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.57-.8 2.05-2.79 1.07-4.32a3.3 3.3 0 00-4.63-1.01l-7.7 4.4a3.3 3.3 0 00-1.07 4.32l1.2.5L5.4 13.9a3.3 3.3 0 001.07 4.32 3.3 3.3 0 004.63 1.01l7.7-4.4a3.3 3.3 0 001.07-4.32zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
          <span>Shorts</span>
        </button>
        <button class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm2 4h12v2H6zm3 4h6v2H9z"/></svg>
          <span>Subscriptions</span>
        </button>
        <hr class="nav-divider" />
        <button class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
          <span>Library</span>
        </button>
        <button class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          <span>History</span>
        </button>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main id="yt-main" class="yt-main">
      <div id="status-bar" class="status-bar">Ready. Search videos or click any thumbnail.</div>

      <!-- Home Feed Section -->
      <section id="home-view" class="home-view">
        <h2 class="feed-title">Recommended Videos</h2>
        <div id="results-grid" class="results-grid"></div>
      </section>

      <!-- Standalone YouTube Watch Page View -->
      <section id="watch-view" class="watch-view hidden">
        <div class="back-bar">
          <button id="back-home-btn" class="back-btn">← Back to Home</button>
        </div>
        <div class="watch-layout">
          <!-- Primary Standalone Video Section -->
          <div class="watch-primary">
            <div id="player-viewport-wrapper" class="player-viewport-wrapper">
              <div id="media-container" class="media-container">
                <video id="video-player" playsinline crossorigin="anonymous"></video>
                <div id="loading-overlay" class="loading-overlay hidden">
                  <div class="spinner"></div>
                  <span id="loading-text">Loading Stream...</span>
                </div>
              </div>

              <!-- Custom Integrated Player Controls -->
              <div class="player-controls-bar">
                <div class="timeline-wrapper">
                  <input type="range" id="timeline-slider" min="0" max="100" value="0" step="0.1" class="timeline-slider" />
                </div>
                <div class="controls-row">
                  <div class="controls-left">
                    <button id="play-pause-btn" class="control-btn" title="Play/Pause">⏸</button>
                    <button id="volume-btn" class="control-btn" title="Mute/Unmute">🔊</button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" class="volume-slider" />
                    <span id="time-display" class="time-display">0:00 / 0:00</span>
                  </div>
                  <div class="controls-right">
                    <label for="player-profile-select" class="profile-label">Quality:</label>
                    <select id="player-profile-select" class="player-profile-select">
                      <option value="360p" selected>360p (Ultra Light)</option>
                      <option value="480p">480p (Standard)</option>
                      <option value="720p">720p (High HD)</option>
                    </select>
                    <button id="fullscreen-btn" class="control-btn" title="Fullscreen">⛶</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Standalone Video Details -->
            <div class="watch-meta">
              <h1 id="video-title-display" class="watch-title">Loading Video...</h1>
              <div class="watch-action-bar">
                <div class="channel-info">
                  <div id="video-channel-icon" class="channel-avatar">C</div>
                  <div class="channel-names">
                    <span id="video-channel-display" class="channel-title">Channel Name</span>
                    <span id="video-subscribers" class="channel-subs">1.4M subscribers</span>
                  </div>
                  <button class="subscribe-btn">Subscribe</button>
                </div>
                <div class="video-actions">
                  <button class="action-pill"><span class="icon">👍</span> 42K</button>
                  <button class="action-pill"><span class="icon">👎</span></button>
                  <button class="action-pill"><span class="icon">↗</span> Share</button>
                  <button class="action-pill"><span class="icon">⬇</span> Download</button>
                </div>
              </div>

              <!-- Collapsible Video Description -->
              <div class="video-description-box">
                <div id="video-views-date" class="desc-stats">1,245,690 views • Premiered 3 days ago</div>
                <div id="video-description-text" class="desc-text">Video description loading...</div>
              </div>
            </div>
          </div>

          <!-- Up Next Sidebar Column -->
          <div class="watch-secondary">
            <h3 class="secondary-title">Up Next</h3>
            <div id="related-grid" class="related-grid"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
